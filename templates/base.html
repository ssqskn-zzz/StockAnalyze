<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}价值投资工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/">价值投资工作台<span>P0</span></a>
    <nav class="side-nav">
      <div class="nav-group">
        <div class="nav-label">工作台</div>
        <a href="/" class="{{ 'active' if page == 'index' else '' }}">企业</a>
        <a href="/processing" class="{{ 'active' if page == 'processing' else '' }}">处理记录</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">配置</div>
        <a href="/metrics" class="{{ 'active' if page == 'metrics' else '' }}">指标字典</a>
      </div>
    </nav>
    <div class="sidebar-foot">
      解析、抽取、写作与测算在助手侧完成；本工作台承载结果、版本与人工确认。
    </div>
  </aside>
  <div class="content">
    <main>
    {% block content %}{% endblock %}
    </main>
    <footer>
      <span>价值投资工作台 P0</span>
    </footer>
  </div>
</div>
</body>
</html>
